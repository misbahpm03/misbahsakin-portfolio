  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#080D10" />

      <!-- scripts/prerender.mjs rewrites the title, description, og:title,
           og:description, og:url and canonical per section at build time. -->
      <title>Md Misbahul Islam — Product Manager</title>
      <meta
        name="description"
        content="Product manager working on SaaS and fintech platforms in Dhaka. A room you can walk around: every object opens a part of the work."
      />
      <link rel="canonical" href="https://misbahsakin.vercel.app" />

      <meta property="og:site_name" content="Md Misbahul Islam" />
      <meta property="og:title" content="Md Misbahul Islam — Product Manager" />
      <meta
        property="og:description"
        content="A room you can walk around. Every object opens a part of the work."
      />
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://misbahsakin.vercel.app" />
      <meta property="og:image" content="https://misbahsakin.vercel.app/og.jpg" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta property="og:image:alt" content="A dark room: desk, lamp, roadmap wall and pinboards, each labelled with a section of the CV." />
      <meta name="twitter:card" content="summary_large_image" />

      <script>
        // Runs before first paint: if scripting is on, the static copy is never
        // shown, so there is no flash of it before the room arrives.
        document.documentElement.className += ' js';
      </script>
      <style>
        html.js #seo-static { display: none; }
        /* the room's own background, painted immediately so a reload does not
           start on white */
        html { background: #080d10; }
      </style>

      <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

      <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Person",
          "name": "Md Misbahul Islam",
          "jobTitle": "Product Manager",
          "url": "https://misbahsakin.vercel.app",
          "image": "https://misbahsakin.vercel.app/og.jpg",
          "email": "mailto:misbahsakin1@gmail.com",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Dhaka",
            "addressCountry": "BD"
          },
          "sameAs": ["https://linkedin.com/in/misbahsakin"],
          "alumniOf": {
            "@type": "CollegeOrUniversity",
            "name": "Chittagong University of Engineering and Technology"
          },
          "knowsAbout": [
            "Product Management",
            "SaaS",
            "Fintech",
            "Agile Delivery",
            "Quality Assurance"
          ]
        }
      </script>
    </head>

    <body>
      <!-- The pre-rendered CV lands in #seo-static, deliberately NOT in #root.
           Inside #root, React had to tear it down and rebuild on every load,
           and that teardown was visible as a flash of a different page. Out
           here it is inert: crawlers and link-preview scrapers read it, and
           main.tsx removes it the moment the app mounts. -->
      <div id="seo-static"></div>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
