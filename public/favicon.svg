<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="A desk lamp lit in a dark room">
  <!-- The room's own vocabulary: the lamp, which is the only warm light in it.
       Kept to two shapes so it still reads at 16px. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="62%" r="50%">
      <stop offset="0" stop-color="#F0B457" stop-opacity=".85"/>
      <stop offset="1" stop-color="#F0B457" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0C1418"/>
  <circle cx="32" cy="40" r="26" fill="url(#glow)"/>
  <path d="M32 13 46 34H18z" fill="#F0B457"/>
  <rect x="30" y="34" width="4" height="15" fill="#EDE9E0"/>
  <rect x="22" y="49" width="20" height="4" rx="2" fill="#EDE9E0"/>
</svg>
